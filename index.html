:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: липкая верхняя панель во всю ширину, под ней колонка 960px: сводка дня, колоды, экраны режимов.
   Стиль по мотивам Quizlet: индиго #4255FF, светло-серый фон, белые карточки, жёлтый акцент, тёмная тема цвета ночного неба. */
:root {
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#282E3E; --muted:#586380; --line:#DADFEA; --soft:#EDEFF4;
  --pri:#4255FF; --pri-ink:#FFFFFF; --pri-text:#4255FF; --pri-soft:#E6E9FF;
  --hl:#FFCD1F; --hl-ink:#282E3E;
  --good:#0E8F62; --good-soft:#DDF5EA; --bad:#D4452E; --bad-soft:#FFE7E2; --warn:#8A6A00; --warn-soft:#FFF3C4;
  --shadow:0 2px 14px rgba(40,46,62,.08);
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-display:var(--f-body); --f-mono:var(--f-body);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0A092D; --surface:#1A2046; --ink:#F6F7FB; --muted:#A8B1CE; --line:#2E3856; --soft:#232B55;
  --pri-text:#A5B0FF; --pri-soft:#262E6B; --good:#36D39B; --good-soft:#0F3A3A; --bad:#FF7A63; --bad-soft:#43201F; --warn:#FFD95A; --warn-soft:#3F3716;
  --shadow:0 2px 18px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0A092D; --surface:#1A2046; --ink:#F6F7FB; --muted:#A8B1CE; --line:#2E3856; --soft:#232B55;
  --pri-text:#A5B0FF; --pri-soft:#262E6B; --good:#36D39B; --good-soft:#0F3A3A; --bad:#FF7A63; --bad-soft:#43201F; --warn:#FFD95A; --warn-soft:#3F3716;
  --shadow:0 2px 18px rgba(0,0,0,.35); color-scheme: dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--f-body);font-variant-numeric:tabular-nums;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
h1,h2,h3{font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
h1{font-size:clamp(24px,5vw,32px)} h2{font-size:20px} h3{font-size:17px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:10px}
.wrap{max-width:960px;margin:0 auto;padding-top:28px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.ico{display:inline-flex;flex:none}
.ico svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* верхняя панель */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px 16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center}
.logo i svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.navlink{background:none;border:0;padding:8px 4px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.navlink.on{color:var(--ink);border-bottom-color:var(--pri)}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600;color:var(--muted)}
.chip b{color:var(--ink);font-weight:800;font-size:14px}
.chip .ico{color:#F5A700}
.sync{font-size:12px;color:var(--muted);padding:28px 0 0;margin:0}

/* кнопки */
.btn{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 20px;border-radius:99px;cursor:pointer;font-weight:700;line-height:1.2;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--pri)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.hl{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--soft);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}

/* сводка дня */
.hero{background:var(--pri);color:#fff;border-radius:20px;padding:22px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:22px;color:#fff} .hero p{margin:4px 0 0;color:rgba(255,255,255,.82)}
.hero.calm{background:var(--surface);color:var(--ink);border:2px solid var(--line)} .hero.calm h2{color:var(--ink)} .hero.calm p{color:var(--muted)}

/* колоды */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.deck{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:150px;transition:box-shadow .15s,transform .15s}
.deck:hover{box-shadow:inset 0 -5px 0 var(--pri);transform:translateY(-2px)}
.deck h3{overflow-wrap:anywhere}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:700;color:var(--muted)}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--good);border-radius:9px;transition:width .3s}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--hl);color:var(--hl-ink);font-weight:800}
.due{font-size:13px;font-weight:700;color:var(--pri-text)} .due.zero{color:var(--muted);font-weight:600}
.empty{border:2px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}

/* панели и формы */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);resize:vertical;min-width:0;font-weight:500}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--pri)}
textarea{min-height:90px}
input[type=text].title-in{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.01em;border:2px solid transparent;background:transparent;padding:4px 8px;margin-left:-8px;width:calc(100% + 8px)}
input[type=text].title-in:hover{border-color:var(--line)}
input[type=text].title-in:focus{border-color:var(--pri);background:var(--surface)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mode{text-align:left;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:128px}
.mode:hover:not(:disabled){border-color:var(--pri);box-shadow:var(--shadow)}
.mode:disabled{opacity:.5;cursor:default}
.mode b{font-size:17px;font-weight:800}
.mode .ico{width:44px;height:44px;border-radius:12px;background:var(--pri-soft);color:var(--pri-text);align-items:center;justify-content:center}
.cards{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:1fr 1fr auto;gap:0 16px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.crow>div{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.crow>div:nth-child(2){border-left:2px solid var(--line);padding-left:16px}
.crow .st{font-size:12px;font-weight:700;color:var(--muted)}
@media(max-width:560px){.crow{grid-template-columns:1fr auto}.crow>div:nth-child(2){grid-column:1;border-left:0;padding:8px 0 0}}

/* флеш-карточка */
.scene{perspective:1400px}
.flip{position:relative;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.flip.on{transform:rotateY(180deg)}
.flip.sm{min-height:260px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:52px 28px 28px;font-size:clamp(22px,4.2vw,32px);font-weight:600;line-height:1.35;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap}
.face.back{transform:rotateY(180deg)}
.face small{position:absolute;top:16px;left:20px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;text-align:center;color:var(--muted);font-size:13px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grade{padding:12px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800}
.grade span{font-size:12px;font-weight:600;color:var(--muted)}
.grade.g0{color:var(--bad)} .grade.g0:hover{background:var(--bad-soft);border-color:var(--bad)}
.grade.g1{color:var(--warn)} .grade.g1:hover{background:var(--warn-soft);border-color:var(--hl)}
.grade.g2{color:var(--pri-text)} .grade.g2:hover{background:var(--pri-soft);border-color:var(--pri)}
.grade.g3{color:var(--good)} .grade.g3:hover{background:var(--good-soft);border-color:var(--good)}
@media(max-width:420px){.grades{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.flip,.bar i,.deck{transition:none}.tile.bad{animation:none!important}}

/* шапка режима */
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.shead .cnt{font-weight:800;font-size:17px}
.shead .lbl{justify-self:end;color:var(--muted);font-size:13px;font-weight:700}

/* письмо, тест, подбор */
.q{font-size:clamp(20px,3.6vw,26px);font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.opt{text-align:left;padding:18px;min-height:68px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;overflow-wrap:anywhere;font-weight:600;font-size:16px;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{min-height:96px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:600;overflow:hidden;overflow-wrap:anywhere}
.tile:hover{border-color:var(--pri)}
.tile.sel{border-color:var(--pri);background:var(--pri-soft)}
.tile.gone{visibility:hidden}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.verdict{padding:14px 16px;border-radius:14px;font-weight:600}
.verdict.ok{background:var(--good-soft);border:2px solid var(--good)}
.verdict.no{background:var(--bad-soft);border:2px solid var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:20;max-width:90vw}
.toast[hidden]{display:none}
</style>
</head>
<body>
<header class="nav">
  <div class="in">
    <button class="logo" id="logo" type="button" aria-label="Зубрилка, на главную"><i id="logo-mark"></i>Зубрилка</button>
    <button class="navlink on" id="nav-home" type="button">Главная</button>
    <div class="stats" id="stats"></div>
    <button class="btn pri sm" id="nav-new" type="button">+ Создать</button>
  </div>
</header>
<div class="wrap">
  <main id="app"></main>
  <p class="sync" id="sync" role="status"></p>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script>
/* ===== утилиты ===== */
const $ = (s) => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k in el) { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const DAY = 864e5;
const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (s) => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function plural(n, a, b, c) { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; }

/* ===== интервальное повторение (вариант SM-2) ===== */
// карточка: f — лицо, b — оборот, e — лёгкость, i — интервал (дни), r — повторы, l — провалы, d — срок (мс), s — n новая / l учится / r в графике
const newCard = (f, b) => ({ id: uid(), f, b, e: 2.5, i: 0, r: 0, l: 0, d: 0, s: 'n' });
function sched(c, g, now) {
  let { e, i, r, l } = c, s = 'r', d;
  if (c.s === 'n' || c.s === 'l') {
    if (g === 0) { s = 'l'; d = now + 60e3; i = 0; }
    else if (g === 1) { s = 'l'; d = now + 6 * 60e3; i = 0; }
    else if (g === 2) { i = 1; r = 1; d = sod(now) + DAY; }
    else { i = 3; r = 1; e += 0.15; d = sod(now) + 3 * DAY; }
  } else if (g === 0) { l++; e = Math.max(1.3, e - 0.2); i = 0; s = 'l'; d = now + 10 * 60e3; }
  else if (g === 1) { e = Math.max(1.3, e - 0.15); i = Math.max(1, Math.round(i * 1.2)); r++; d = sod(now) + i * DAY; }
  else if (g === 2) { i = Math.max(i + 1, Math.round(i * e)); r++; d = sod(now) + i * DAY; }
  else { e += 0.15; i = Math.max(i + 2, Math.round(i * e * 1.3)); r++; d = sod(now) + i * DAY; }
  return { e, i, r, l, d, s };
}
function previewLabel(c, g, now) {
  const n = sched(c, g, now);
  if (n.s === 'l') { const m = Math.max(1, Math.round((n.d - now) / 60e3)); return m + ' мин'; }
  const days = Math.round((n.d - sod(now)) / DAY);
  return days >= 30 ? Math.round(days / 30) + ' мес' : days + ' д';
}
const NEW_PER_SESSION = 20;
const dueOf = (deck, now = Date.now()) => deck.cards.filter((c) => c.s !== 'n' && c.d <= now).sort((a, b) => a.d - b.d);
const newOf = (deck) => deck.cards.filter((c) => c.s === 'n');
const learnedOf = (deck) => deck.cards.filter((c) => c.s === 'r' && c.i >= 21).length;

/* ===== состояние и хранение ===== */
const LS = 'zubrilka.v1';
let state = { decks: [], meta: { seeded: false, days: {} }, cloud: false };
let mode = 'local', ref = null;
const dirty = new Set(), delQ = new Set();
let metaDirty = false, flushTimer = null, chain = Promise.resolve();

function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) { /* хранилище недоступно */ } }
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s && Array.isArray(s.decks)) { s.meta = s.meta || { seeded: false, days: {} }; return s; } } catch (e) { /* пусто */ } return null; }
const deckDoc = (d) => ({ name: d.name, created: d.created, updated: d.updated, cards: d.cards });
const metaDoc = () => { const days = {}; Object.keys(state.meta.days).sort().slice(-90).forEach((k) => { days[k] = state.meta.days[k]; }); return { seeded: !!state.meta.seeded, days }; };
const clone = (o) => JSON.parse(JSON.stringify(o));
function touch(deck) { deck.updated = Date.now(); dirty.add(deck.id); persist(); }
function touchMeta() { metaDirty = true; persist(); }
function removeDeck(id) { state.decks = state.decks.filter((d) => d.id !== id); dirty.delete(id); delQ.add(id); persist(); }
function persist() { saveLocal(); if (mode !== 'cloud') return; clearTimeout(flushTimer); flushTimer = setTimeout(flush, 900); }
function flush() { clearTimeout(flushTimer); chain = chain.then(doFlush).catch(() => {}); return chain; }
async function doFlush() {
  if (mode !== 'cloud' || !ref) return;
  const ids = [...dirty], dels = [...delQ], wantMeta = metaDirty;
  dirty.clear(); delQ.clear(); metaDirty = false;
  try {
    for (const id of ids) { const d = state.decks.find((x) => x.id === id); if (d) await ref.doc('d_' + id).set(deckDoc(d)); }
    for (const id of dels) await ref.doc('d_' + id).delete();
    if (wantMeta) await ref.doc('meta').set(metaDoc());
    setSync('cloud');
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked')) { mode = 'local'; setSync('denied'); return; }
    ids.forEach((i) => dirty.add(i)); dels.forEach((i) => delQ.add(i)); if (wantMeta) metaDirty = true;
    setSync(e && e.code === 'quota_exceeded' ? 'quota' : 'retry');
    if (!(e && e.code === 'quota_exceeded')) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 8000); }
  }
}
const SYNC_TEXT = {
  cloud: 'Сохранено в вашем аккаунте. Колоды и прогресс доступны на любом устройстве.',
  local: 'Сохраняется только на этом устройстве. Сделайте резервную копию внизу главной страницы.',
  denied: 'Сохранение в аккаунт недоступно при вашем уровне доступа. Данные хранятся на этом устройстве.',
  retry: 'Не удалось сохранить в аккаунт. Пробую ещё раз, данные пока лежат в браузере.',
  quota: 'Достигнут лимит хранилища. Удалите ненужные колоды, данные пока лежат в браузере.',
  wait: 'Загружаю ваши колоды…'
};
function setSync(k) { $('#sync').textContent = SYNC_TEXT[k] || ''; }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);

function addSample() {
  const pairs = [
    ['Митохондрия', 'Органоид, где идёт клеточное дыхание и синтезируется АТФ'],
    ['Рибосома', 'Немембранный органоид, на котором собирается белок'],
    ['Ядро', 'Хранит ДНК и управляет работой клетки'],
    ['Аппарат Гольджи', 'Сортирует, упаковывает и выводит вещества из клетки'],
    ['Лизосома', 'Пузырёк с ферментами, переваривающий ненужные частицы'],
    ['Хлоропласт', 'Пластида растений, в которой идёт фотосинтез'],
    ['Шероховатая ЭПС', 'Сеть мембранных каналов с рибосомами, синтез и транспорт белков'],
    ['Центральная вакуоль', 'Хранит воду и растворённые вещества, поддерживает тургор']
  ];
  state.decks.push({ id: uid(), name: 'Пример · Органоиды клетки', created: Date.now(), updated: Date.now(), cards: pairs.map(([f, b]) => newCard(f, b)) });
  state.meta.seeded = true;
}
function fromCloud(snap) {
  const decks = [];
  let meta = { seeded: false, days: {} };
  snap.docs.forEach((s) => {
    const data = clone(s.data() || {});
    if (s.id === 'meta') meta = { seeded: !!data.seeded, days: data.days || {} };
    else if (s.id.indexOf('d_') === 0) decks.push({ id: s.id.slice(2), name: data.name || 'Без названия', created: data.created || 0, updated: data.updated || 0, cards: data.cards || [] });
  });
  return { decks: decks.sort((a, b) => a.created - b.created), meta };
}
async function initStore() {
  const local = loadLocal();
  if (local) state = local;
  render();
  const cl = window.claude;
  let user = null, db = null;
  try { if (cl && cl.use) [user, db] = await Promise.all([cl.use('user'), cl.use('db')]); } catch (e) { /* без облака */ }
  const id = user ? await user.id() : null;
  if (!db || !id) { mode = 'local'; return finishInit('local'); }
  try {
    ref = db.collection('data/users/' + id);
    setSync('wait');
    const snap = await withTimeout(ref.get(), 10000);
    const cloud = fromCloud(snap);
    if (!snap.empty) {
      if (state.cloud) { state.decks = cloud.decks; state.meta = cloud.meta; }
      else { // первый вход с облаком: объединяем с тем, что лежало в браузере
        const byId = new Map(cloud.decks.map((d) => [d.id, d]));
        state.decks.forEach((d) => { const o = byId.get(d.id); if (!o || (d.updated || 0) > (o.updated || 0)) { byId.set(d.id, d); dirty.add(d.id); } });
        state.decks = [...byId.values()].sort((a, b) => a.created - b.created);
        state.meta = { seeded: state.meta.seeded || cloud.meta.seeded, days: Object.assign({}, cloud.meta.days, state.meta.days) };
        metaDirty = true;
      }
    } else { state.decks.forEach((d) => dirty.add(d.id)); metaDirty = true; }
    state.cloud = true; mode = 'cloud';
    finishInit('cloud');
    if (dirty.size || metaDirty) flush();
  } catch (e) {
    mode = 'local';
    finishInit(e && e.code === 'invalid_argument' ? 'denied' : 'local');
  }
}
function finishInit(kind) {
  if (!state.decks.length && !state.meta.seeded) { addSample(); state.decks.forEach((d) => dirty.add(d.id)); metaDirty = true; if (mode === 'cloud') flush(); }
  saveLocal(); setSync(kind); render();
}
window.addEventListener('pagehide', () => { if (mode === 'cloud') flush(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'cloud') flush(); });

/* ===== статистика дня ===== */
function logReview(ok) {
  const k = dayKey(Date.now()), d = state.meta.days[k] || (state.meta.days[k] = { n: 0, ok: 0 });
  d.n++; if (ok) d.ok++; touchMeta();
}
function streak() {
  let n = 0, t = Date.now();
  if (!(state.meta.days[dayKey(t)] || {}).n) t -= DAY;
  while ((state.meta.days[dayKey(t)] || {}).n) { n++; t -= DAY; }
  return n;
}
/* ===== иконки (статичные строки, пользовательских данных в них нет) ===== */
const ICONS = {
  cards: '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v9"/></svg>',
  write: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  test: '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l1.5 1.5L12 8M8 15l1.5 1.5L12 14M14.5 9.5H17M14.5 15.5H17"/></svg>',
  match: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="13" width="7" height="7" rx="1.5"/><path d="M14 7.5h3a2 2 0 0 1 2 2V11M10 16.5H7a2 2 0 0 1-2-2V13"/></svg>',
  flame: '<svg viewBox="0 0 24 24"><path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z" fill="currentColor"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'
};
const icon = (n) => { const s = document.createElement('span'); s.className = 'ico'; s.innerHTML = ICONS[n] || ''; return s; };
$('#logo-mark').innerHTML = ICONS.cards;

/* ===== навигация ===== */
let view = { n: 'home' }, reverse = false, keyHandler = null, tick = null;
document.addEventListener('keydown', (e) => { if (keyHandler) keyHandler(e); });
function go(v) { view = v; keyHandler = null; clearInterval(tick); render(); window.scrollTo(0, 0); }
function renderStats() {
  const s = streak();
  $('#stats').replaceChildren(
    h('span', { class: 'chip', title: 'Дней подряд с повторениями' }, icon('flame'), h('b', { text: String(s) }), plural(s, 'день', 'дня', 'дней') + ' подряд'),
    h('span', { class: 'chip', title: 'Карточек повторено сегодня' }, h('b', { text: String((state.meta.days[dayKey(Date.now())] || {}).n || 0) }), 'сегодня'));
}
$('#nav-home').addEventListener('click', () => go({ n: 'home' }));
$('#nav-new').addEventListener('click', () => go({ n: 'home', adding: true }));
function render() {
  renderStats();
  $('#nav-home').classList.toggle('on', view.n === 'home');
  const app = $('#app'); app.replaceChildren();
  if (view.n === 'home') return app.append(homeView());
  const d = state.decks.find((x) => x.id === view.id);
  if (!d) { view = { n: 'home' }; return render(); }
  app.append(view.n === 'deck' ? deckView(d) : studyView(d));
}
$('#logo').addEventListener('click', () => go({ n: 'home' }));
const back = (to, label) => h('button', { class: 'btn ghost sm', type: 'button', onclick: () => go(to) }, icon('back'), label);
const dueText = (d) => { const n = dueOf(d).length, w = Math.min(NEW_PER_SESSION, newOf(d).length); return { n, w }; };

/* ===== главная ===== */
function homeView() {
  const root = h('div', { class: 'stack' });
  const nameIn = h('input', { type: 'text', id: 'new-deck-name', placeholder: 'Например: Английский, неделя 5', maxLength: 80 });
  const create = () => {
    const name = nameIn.value.trim(); if (!name) return nameIn.focus();
    const d = { id: uid(), name, created: Date.now(), updated: Date.now(), cards: [] };
    state.decks.push(d); touch(d); go({ n: 'deck', id: d.id });
  };
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
  const form = h('div', { class: 'panel stack', hidden: !view.adding },
    h('div', { class: 'field' }, h('label', { for: 'new-deck-name', text: 'Название колоды' }), nameIn),
    h('div', { class: 'row' }, h('button', { class: 'btn pri', type: 'button', onclick: create }, 'Создать'),
      h('button', { class: 'btn ghost', type: 'button', onclick: () => { form.hidden = true; } }, 'Отмена')));
  const sumDue = state.decks.reduce((s, d) => s + dueOf(d).length, 0), sumNew = state.decks.reduce((s, d) => s + Math.min(NEW_PER_SESSION, newOf(d).length), 0);
  const target = state.decks.find((d) => dueOf(d).length) || state.decks.find((d) => newOf(d).length);
  if (target) root.append(h('div', { class: 'hero' }, h('div', { class: 'grow' }, h('h2', { text: 'Пора повторять' }),
    h('p', { text: 'К повторению: ' + sumDue + ' · новых карточек: ' + sumNew + '. Начнём с колоды «' + target.name + '».' })),
    h('button', { class: 'btn hl', type: 'button', onclick: () => go({ n: 'study', id: target.id, mode: 'srs' }) }, 'Начать')));
  else if (state.decks.length) root.append(h('div', { class: 'hero calm' }, h('div', { class: 'grow' }, h('h2', { text: 'На сегодня всё' }),
    h('p', { text: 'Следующие карточки уже стоят в графике. Загляните позже или потренируйтесь в режимах «Тест» и «Подбор».' }))));
  root.append(h('h2', { text: 'Мои колоды' }), form);
  if (view.adding) setTimeout(() => nameIn.focus(), 0);
  if (!state.decks.length) {
    root.append(h('div', { class: 'empty' }, 'Колод пока нет. Создайте первую и добавьте карточки: термин на одной стороне, определение на другой.'));
  } else {
    root.append(h('div', { class: 'decks' }, state.decks.map((d) => {
      const { n, w } = dueText(d), tot = d.cards.length, pct = tot ? Math.round(learnedOf(d) / tot * 100) : 0;
      return h('button', { class: 'deck', type: 'button', onclick: () => go({ n: 'deck', id: d.id }) },
        h('h3', { text: d.name }),
        h('span', { class: 'pill', style: 'align-self:flex-start', text: tot + ' ' + plural(tot, 'термин', 'термина', 'терминов') }),
        h('div', { class: 'bar', style: 'margin-top:auto', title: 'Выучено: ' + pct + '%' }, h('i', { style: 'width:' + pct + '%' })),
        h('div', { class: 'row' }, n ? h('span', { class: 'tag', text: 'повторить: ' + n }) : null,
          h('span', { class: 'due' + (n || w ? '' : ' zero'), text: w ? 'новых: ' + w : (n ? '' : 'на сегодня всё') })));
    })));
  }
  root.append(backupPanel());
  return root;
}
function backupPanel() {
  const file = h('input', { type: 'file', id: 'imp-file', accept: '.json,application/json', hidden: true });
  file.addEventListener('change', () => {
    const f = file.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(String(r.result)); if (!data || !Array.isArray(data.decks)) throw 0;
        let added = 0;
        data.decks.forEach((nd) => {
          if (!nd || !nd.id || !Array.isArray(nd.cards)) return;

  clearInterval(tick); tick = setInterval(() => { if (t0) timeEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' с'; }, 100);
  function click(t, el) {
    if (el.classList.contains('gone')) return; if (!t0) t0 = Date.now();
    if (!sel) { sel = { t, el }; el.classList.add('sel'); return; }
    if (sel.el === el) { el.classList.remove('sel'); sel = null; return; }
    const a = sel; sel = null; a.el.classList.remove('sel');
    if (a.t.cid === t.cid && a.t.k !== t.k) { a.el.classList.add('gone'); el.classList.add('gone'); if (--left === 0) win(); }
    else { [a.el, el].forEach((x) => x.classList.add('bad')); setTimeout(() => [a.el, el].forEach((x) => x.classList.remove('bad')), 500); }
  }
  function win() {
    clearInterval(tick); const sec = ((Date.now() - t0) / 1000).toFixed(1);
    grid.replaceWith(endPanel(d, 'Все пары найдены за ' + sec + ' с', ['Попробуйте побить своё время.'], h('button', { class: 'btn pri', type: 'button', onclick: () => go({ n: 'study', id: d.id, mode: 'match' }) }, 'Ещё раз')));
  }
  tiles.forEach((t) => { const el = h('button', { class: 'tile', type: 'button', text: t.t }); el.addEventListener('click', () => click(t, el)); grid.append(el); });
  root.append(h('div', { class: 'row' }, back({ n: 'deck', id: d.id }, 'К колоде'), h('span', { class: 'grow' }), h('b', {}, timeEl)),
    h('p', { class: 'muted small', style: 'margin:0', text: 'Нажмите на термин и на его определение, чтобы убрать пару.' }), grid);
  return root;
}

initStore();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
