<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Зубрилка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: липкая верхняя панель во всю ширину, под ней колонка 960px: сводка дня, колоды, экраны режимов.
   Стиль по мотивам Quizlet: индиго #4255FF, светло-серый фон, белые карточки, жёлтый акцент, тёмная тема цвета ночного неба. */
:root {
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#282E3E; --muted:#586380; --line:#DADFEA; --soft:#EDEFF4;
  --pri:#4255FF; --pri-ink:#FFFFFF; --pri-text:#4255FF; --pri-soft:#E6E9FF;
  --hl:#FFCD1F; --hl-ink:#282E3E;
  --good:#0E8F62; --good-soft:#DDF5EA; --bad:#D4452E; --bad-soft:#FFE7E2; --warn:#8A6A00; --warn-soft:#FFF3C4;
  --shadow:0 2px 14px rgba(40,46,62,.08);
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-display:var(--f-body); --f-mono:var(--f-body);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0A092D; --surface:#1A2046; --ink:#F6F7FB; --muted:#A8B1CE; --line:#2E3856; --soft:#232B55;
  --pri-text:#A5B0FF; --pri-soft:#262E6B; --good:#36D39B; --good-soft:#0F3A3A; --bad:#FF7A63; --bad-soft:#43201F; --warn:#FFD95A; --warn-soft:#3F3716;
  --shadow:0 2px 18px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0A092D; --surface:#1A2046; --ink:#F6F7FB; --muted:#A8B1CE; --line:#2E3856; --soft:#232B55;
  --pri-text:#A5B0FF; --pri-soft:#262E6B; --good:#36D39B; --good-soft:#0F3A3A; --bad:#FF7A63; --bad-soft:#43201F; --warn:#FFD95A; --warn-soft:#3F3716;
  --shadow:0 2px 18px rgba(0,0,0,.35); color-scheme: dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--f-body);font-variant-numeric:tabular-nums;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
h1,h2,h3{font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
h1{font-size:clamp(24px,5vw,32px)} h2{font-size:20px} h3{font-size:17px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:10px}
.wrap{max-width:960px;margin:0 auto;padding-top:28px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.ico{display:inline-flex;flex:none}
.ico svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* верхняя панель */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px 16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center}
.logo i svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.navlink{background:none;border:0;padding:8px 4px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.navlink.on{color:var(--ink);border-bottom-color:var(--pri)}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600;color:var(--muted)}
.chip b{color:var(--ink);font-weight:800;font-size:14px}
.chip .ico{color:#F5A700}
.sync{font-size:12px;color:var(--muted);padding:28px 0 0;margin:0}

/* кнопки */
.btn{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 20px;border-radius:99px;cursor:pointer;font-weight:700;line-height:1.2;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--pri)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.hl{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--soft);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}

/* сводка дня */
.hero{background:var(--pri);color:#fff;border-radius:20px;padding:22px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:22px;color:#fff} .hero p{margin:4px 0 0;color:rgba(255,255,255,.82)}
.hero.calm{background:var(--surface);color:var(--ink);border:2px solid var(--line)} .hero.calm h2{color:var(--ink)} .hero.calm p{color:var(--muted)}

/* колоды */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.deck{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:150px;transition:box-shadow .15s,transform .15s}
.deck:hover{box-shadow:inset 0 -5px 0 var(--pri);transform:translateY(-2px)}
.deck h3{overflow-wrap:anywhere}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:700;color:var(--muted)}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--good);border-radius:9px;transition:width .3s}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--hl);color:var(--hl-ink);font-weight:800}
.due{font-size:13px;font-weight:700;color:var(--pri-text)} .due.zero{color:var(--muted);font-weight:600}
.empty{border:2px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}

/* панели и формы */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);resize:vertical;min-width:0;font-weight:500}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--pri)}
textarea{min-height:90px}
input[type=text].title-in{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.01em;border:2px solid transparent;background:transparent;padding:4px 8px;margin-left:-8px;width:calc(100% + 8px)}
input[type=text].title-in:hover{border-color:var(--line)}
input[type=text].title-in:focus{border-color:var(--pri);background:var(--surface)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mode{text-align:left;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:128px}
.mode:hover:not(:disabled){border-color:var(--pri);box-shadow:var(--shadow)}
.mode:disabled{opacity:.5;cursor:default}
.mode b{font-size:17px;font-weight:800}
.mode .ico{width:44px;height:44px;border-radius:12px;background:var(--pri-soft);color:var(--pri-text);align-items:center;justify-content:center}
.cards{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:1fr 1fr auto;gap:0 16px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.crow>div{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.crow>div:nth-child(2){border-left:2px solid var(--line);padding-left:16px}
.crow .st{font-size:12px;font-weight:700;color:var(--muted)}
@media(max-width:560px){.crow{grid-template-columns:1fr auto}.crow>div:nth-child(2){grid-column:1;border-left:0;padding:8px 0 0}}

/* флеш-карточка */
.scene{perspective:1400px}
.flip{position:relative;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.flip.on{transform:rotateY(180deg)}
.flip.sm{min-height:260px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:52px 28px 28px;font-size:clamp(22px,4.2vw,32px);font-weight:600;line-height:1.35;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap}
.face.back{transform:rotateY(180deg)}
.face small{position:absolute;top:16px;left:20px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;text-align:center;color:var(--muted);font-size:13px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grade{padding:12px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800}
.grade span{font-size:12px;font-weight:600;color:var(--muted)}
.grade.g0{color:var(--bad)} .grade.g0:hover{background:var(--bad-soft);border-color:var(--bad)}
.grade.g1{color:var(--warn)} .grade.g1:hover{background:var(--warn-soft);border-color:var(--hl)}
.grade.g2{color:var(--pri-text)} .grade.g2:hover{background:var(--pri-soft);border-color:var(--pri)}
.grade.g3{color:var(--good)} .grade.g3:hover{background:var(--good-soft);border-color:var(--good)}
@media(max-width:420px){.grades{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.flip,.bar i,.deck{transition:none}.tile.bad{animation:none!important}}

/* шапка режима */
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.shead .cnt{font-weight:800;font-size:17px}
.shead .lbl{justify-self:end;color:var(--muted);font-size:13px;font-weight:700}

/* письмо, тест, подбор */
.q{font-size:clamp(20px,3.6vw,26px);font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.opt{text-align:left;padding:18px;min-height:68px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;overflow-wrap:anywhere;font-weight:600;font-size:16px;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{min-height:96px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:600;overflow:hidden;overflow-wrap:anywhere}
.tile:hover{border-color:var(--pri)}
.tile.sel{border-color:var(--pri);background:var(--pri-soft)}
.tile.gone{visibility:hidden}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.verdict{padding:14px 16px;border-radius:14px;font-weight:600}
.verdict.ok{background:var(--good-soft);border:2px solid var(--good)}
.verdict.no{background:var(--bad-soft);border:2px solid var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:20;max-width:90vw}
.toast[hidden]{display:none}

/* кнопки-значки в шапке */
.tools{display:flex;gap:2px;align-items:center}
.iconbtn{appearance:none;width:40px;height:40px;border:0;border-radius:99px;background:transparent;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--soft);color:var(--ink)}

/* статистика */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-size:28px;font-weight:800;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;padding-top:8px}
.yax{position:relative;width:28px;height:180px}
.yax span{position:absolute;right:0;transform:translateY(50%);font-size:12px;line-height:1;color:var(--muted)}
.plot{position:relative;height:180px;border-bottom:1px solid var(--line)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--soft)}
.cols{position:absolute;inset:0;display:flex}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-inline:1px}
.col.on{background:var(--soft)}
.col i{display:block;flex:none;width:100%;max-width:22px;min-height:3px}
.col i:first-child{border-radius:4px 4px 0 0}
.col i.gap{border-bottom:2px solid var(--surface);background-clip:padding-box;min-height:5px}
.seg-ok,.swatch-ok{background-color:var(--good)}
.seg-err,.swatch-err{background-color:var(--bad);background-image:repeating-linear-gradient(135deg,transparent 0 2px,var(--bad-soft) 2px 4px)}
.seg-due{background-color:var(--pri-text)}
.tipbox{position:absolute;top:4px;left:0;z-index:2;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;width:max-content;max-width:100%}
.xax{grid-column:2;position:relative;height:22px;margin-top:6px}
.xax span{position:absolute;top:0;font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:block;width:12px;height:12px;border-radius:3px}
.more summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.more[open] summary{margin-bottom:8px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:break-word}
.tbl th{font-size:12px;font-weight:800;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.errcell{display:flex;align-items:center;gap:8px;min-width:96px}
.errcell .bar{flex:1 1 auto}
.errcell b{flex:none;width:40px;text-align:right}
.bar.err i{background:var(--bad)}

/* свап карточек */
.stage{position:relative;z-index:1;padding-bottom:18px}
.stage .scene{position:relative;z-index:1}
.under{position:absolute;inset:0 0 18px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.under.u1{transform:translateY(9px) scale(.97)}
.under.u2{transform:translateY(18px) scale(.94);opacity:.65}
.scene.swipe{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.scene.swipe img{pointer-events:none}
.scene[data-fx="bad"] .face{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.scene[data-fx="warn"] .face{border-color:var(--hl);box-shadow:0 0 0 4px var(--warn-soft)}
.scene[data-fx="pri"] .face{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.scene[data-fx="good"] .face{border-color:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.stamp{position:absolute;top:14px;left:50%;transform:translateX(-50%) rotate(-5deg);z-index:3;pointer-events:none;padding:4px 16px;border-radius:10px;border:3px solid currentColor;background:var(--surface);font-size:18px;font-weight:800;opacity:0}
.stamp[data-kind="bad"]{color:var(--bad)}
.stamp[data-kind="warn"]{color:var(--warn)}
.stamp[data-kind="pri"]{color:var(--pri-text)}
.stamp[data-kind="good"]{color:var(--good)}
.enter{animation:cardIn .3s cubic-bezier(.2,.8,.3,1)}
.enter-l{animation:cardFromLeft .28s cubic-bezier(.2,.8,.3,1)}
.enter-r{animation:cardFromRight .28s cubic-bezier(.2,.8,.3,1)}
@keyframes cardIn{from{transform:translateY(9px) scale(.97);opacity:.6}}
@keyframes cardFromLeft{from{transform:translateX(-40px);opacity:0}}
@keyframes cardFromRight{from{transform:translateX(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.enter,.enter-l,.enter-r{animation:none}}

/* пропуски, сборка, лестница, спринт */
.cloze{font-size:18px;line-height:2.2;white-space:pre-wrap;overflow-wrap:anywhere}
input[type=text].blank{display:inline-block;max-width:100%;padding:2px 8px;margin:0 2px;border-radius:8px;line-height:1.4;font-weight:700;text-align:center}
input[type=text].blank.ok{border-color:var(--good);background:var(--good-soft)}
input[type=text].blank.no{border-color:var(--bad);background:var(--bad-soft)}
.tray{min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tray.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.tray.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.bchip{appearance:none;min-width:44px;min-height:44px;padding:6px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:700;overflow-wrap:anywhere;max-width:100%}
.bchip:hover:not(:disabled){border-color:var(--pri)}
.bchip:disabled{cursor:default}
.rungs{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.rungs i{display:block;width:26px;height:8px;border-radius:9px;background:var(--soft)}
.rungs i.on{background:var(--pri-text)}
.rungs span{margin-left:6px}
.face.duo{flex-direction:column;gap:12px;font-size:clamp(16px,2.6vw,20px);font-weight:500;line-height:1.4}
.face.duo .q1{font-size:clamp(20px,3.4vw,26px);font-weight:800}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{font-size:13px;font-weight:700;color:var(--muted);min-height:20px}

/* фильтры и теги */
.fchip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--muted);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;min-height:34px;max-width:100%;overflow-wrap:anywhere}
.fchip:hover{border-color:var(--pri)}
.fchip[aria-pressed="true"]{background:var(--pri-soft);border-color:var(--pri);color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap}

    const good = opts[k] === right;
    playSound(good ? 'right' : 'wrong');
    if (!good) btns[k].classList.add('no');
    btns[opts.indexOf(right)].classList.add('ok'); btns.forEach((b) => { b.disabled = true; });
    if (good) setTimeout(() => { if (btns[k].isConnected) done(true); }, 550);
    else { nextBtn.hidden = false; nextBtn.focus(); }
  }
  keyHandler = (e) => { const k = digitKey(e); if (k > -1) pick(k); };
  return h('div', { class: 'stack' }, stepPanel(c), h('div', { class: 'opts' }, btns), nextBtn);
}
function stepType(c, done) {
  const right = plain(aOf(c)), out = h('div', { class: 'stack' }); let checked = false;
  const inp = h('input', { type: 'text', id: 'ans', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, placeholder: 'Ваш ответ', 'aria-label': 'Ваш ответ' });
  const btn = h('button', { class: 'btn pri', type: 'button', onclick: check }, 'Проверить');
  function check() {
    if (checked) return; checked = true; inp.readOnly = true; btn.hidden = true;
    stepResult(out, closeEnough(norm(inp.value), norm(right)), right, done);
  }
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
  queueMicrotask(() => inp.focus());
  return stepPanel(c, inp, btn, out);
}

const STOP_WORDS = new Set(['который', 'которая', 'которое', 'которые', 'которых', 'также', 'этого', 'этот', 'этой', 'этих', 'может', 'могут', 'после', 'через', 'между', 'перед', 'когда', 'чтобы', 'только', 'очень', 'более', 'менее', 'того', 'него', 'всего', 'всех', 'with', 'that', 'this', 'from']);
function clozeInfo(text) {
  const parts = text.split(/([\p{L}\p{N}][\p{L}\p{N}-]*)/u), words = [];
  for (let i = 1; i < parts.length; i += 2) words.push(i);
  const minLen = words.length <= 2 ? 2 : 4;
  return { parts, cand: words.filter((i) => parts[i].length >= minLen && !STOP_WORDS.has(parts[i].toLowerCase())), count: Math.max(1, Math.min(3, Math.round(words.length / 6))) };
}
const canCloze = (c) => clozeInfo(plain(aOf(c))).cand.length > 0;
function stepCloze(c, done) {
  const right = plain(aOf(c)), { parts, cand, count } = clozeInfo(right);
  const picks = new Set(shuffle(cand.slice().sort((a, b) => parts[b].length - parts[a].length).slice(0, count * 2)).slice(0, count));
  const blanks = [], out = h('div', { class: 'stack' }); let checked = false;
  const line = h('div', { class: 'cloze' }, parts.map((p, i) => {
    if (!picks.has(i)) return p;
    const inp = h('input', { type: 'text', class: 'blank', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, 'aria-label': 'Пропущенное слово ' + (blanks.length + 1), style: 'width:calc(' + p.length + 'ch + 34px)' });
    const k = blanks.length;
    inp.addEventListener('keydown', (e) => { if (e.key !== 'Enter') return; if (blanks[k + 1]) blanks[k + 1].inp.focus(); else check(); });
    blanks.push({ inp, word: p });
    return inp;
  }));
  const checkBtn = h('button', { class: 'btn pri', type: 'button', onclick: check }, 'Проверить');
  const hintBtn = h('button', { class: 'btn ghost', type: 'button', onclick: () => { blanks.forEach((b) => { b.inp.placeholder = b.word[0] + '…'; }); hintBtn.hidden = true; } }, 'Подсказка: первая буква');
  const controls = h('div', { class: 'row' }, checkBtn, hintBtn);
  function check() {
    if (checked) return; checked = true; controls.hidden = true;
    const results = blanks.map((b) => closeEnough(norm(b.inp.value), norm(b.word)));
    blanks.forEach((b, i) => { b.inp.readOnly = true; b.inp.classList.add(results[i] === 'no' ? 'no' : 'ok'); });
    stepResult(out, results.includes('no') ? 'no' : results.includes('near') ? 'near' : 'ok', right, done);
  }
  queueMicrotask(() => blanks[0].inp.focus());
  return stepPanel(c, line, controls, out);
}

const buildTokens = (text) => {
  const words = text.split(/\s+/).filter(Boolean);
  return words.length >= 3 ? { sep: ' ', tokens: words } : { sep: '', tokens: [...text.replace(/\s+/g, '').toLocaleLowerCase('ru')] };
};
const canBuild = (c) => {
  const t = plain(aOf(c)), { sep, tokens } = buildTokens(t);
  return tokens.length >= 2 && new Set(tokens).size >= 2 && tokens.length <= (sep ? 14 : 24);
};
function stepBuild(c, done) {
  const right = plain(aOf(c)), { sep, tokens } = buildTokens(right), target = norm(tokens.join(sep));
  let order = shuffle(tokens);
  for (let i = 0; i < 6 && norm(order.join(sep)) === target; i++) order = shuffle(tokens);
  const pool = h('div', { class: 'pool' }), tray = h('div', { class: 'tray', 'aria-label': 'Собранный ответ' }), out = h('div', { class: 'stack' });
  const placed = []; let checked = false;
  const chips = order.map((t) => {
    const chip = h('button', { class: 'bchip', type: 'button', text: t, onclick: () => move(chip) });
    pool.append(chip);
    return chip;
  });
  function move(chip) {
    if (checked) return;
    const i = placed.indexOf(chip);
    if (i > -1) { placed.splice(i, 1); pool.append(chip); return; }
    placed.push(chip); tray.append(chip);
    if (placed.length === chips.length) check();
  }
  function check() {
    checked = true; clearBtn.hidden = true; keyHandler = null;
    chips.forEach((b) => { b.disabled = true; });
    const good = norm(placed.map((b) => b.textContent).join(sep)) === target;
    tray.classList.add(good ? 'ok' : 'no');
    stepResult(out, good ? 'ok' : 'no', right, done);
  }
  const clearBtn = h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { placed.splice(0).forEach((b) => pool.append(b)); } }, 'Начать заново');
  keyHandler = (e) => {
    if (e.key === 'Backspace' && placed.length) { e.preventDefault(); return move(placed[placed.length - 1]); }
    if (sep || e.key.length !== 1 || e.ctrlKey || e.metaKey) return;
    const yo = (s) => s.replace(/ё/g, 'е'), k = yo(e.key.toLocaleLowerCase('ru')), chip = chips.find((b) => !placed.includes(b) && yo(b.textContent) === k);
    if (chip) move(chip);
  };
  return stepPanel(c, tray, pool, h('div', { class: 'row' }, clearBtn, h('span', { class: 'muted small', text: sep ? 'Нажимайте на слова по порядку.' : 'Нажимайте на буквы или печатайте их.' })), out);
}

function drillView(d, label, eligible, step) {
  const q = shuffle(d.cards.filter(eligible)).slice(0, 15).map((c) => c.id), total = q.length, retried = new Set();
  let done = 0, first = 0;
  const root = h('div', { class: 'stack' }), box = h('div', { class: 'stack' }), bar = progBar();
  root.append(studyHead(d, label), bar, box);
  function show() {
    setBar(bar, total ? done / total : 1, total ? Math.min(done + 1, total) + ' / ' + total : ''); box.replaceChildren(); keyHandler = null;
    if (!total) return box.append(endPanel(d, 'Нет подходящих карточек', ['В этом режиме нужны карточки с текстовым ответом подходящей длины.'], null));
    if (!q.length) {
      playSound('finish');
      return box.append(endPanel(d, 'Готово', ['С первого раза верно: ' + first + ' из ' + total], h('button', { class: 'btn pri', type: 'button', onclick: () => go({ n: 'study', id: d.id, mode: view.mode }) }, 'Ещё раз')));
    }
    const c = d.cards.find((x) => x.id === q[0]);
    box.append(step(c, (good) => {
      q.shift();
      if (good) { if (!retried.has(c.id)) first++; done++; }
      else { retried.add(c.id); q.splice(Math.min(3, q.length), 0, c.id); }
      show();
    }));
  }
  show(); return root;
}
const clozeView = (d) => drillView(d, 'Пропуски', canCloze, stepCloze);
const buildView = (d) => drillView(d, 'Сборка', canBuild, stepBuild);

/* лестница: три шага на карточку, ошибка возвращает на шаг назад */
function ladderView(d) {
  const now = Date.now();
  const urgency = (c) => (c.s !== 'n' && c.d <= now ? 100 : 0) + (c.l || 0) * 10 + (2.5 - c.e) * 10 + (c.s === 'n' ? 5 : 0);
  const items = shuffle(d.cards.filter((c) => plain(aOf(c)))).sort((a, b) => urgency(b) - urgency(a)).slice(0, 8).map((c) => ({ id: c.id, lv: 0, errs: 0 }));
  const q = items.slice(); let clean = 0, updated = 0;
  const root = h('div', { class: 'stack' }), box = h('div', { class: 'stack' }), bar = progBar();
  root.append(studyHead(d, 'Лестница'), bar, box);
  function stepFor(lv, c) {
    if (lv === 0) return ['Выбор', (fn) => stepChoice(d, c, fn)];
    const words = plain(aOf(c)).split(/\s+/).length;
    if (lv === 1) return canBuild(c) ? ['Сборка', (fn) => stepBuild(c, fn)] : canCloze(c) ? ['Пропуски', (fn) => stepCloze(c, fn)] : ['Письмо', (fn) => stepType(c, fn)];
    return words > 4 && canCloze(c) ? ['Пропуски', (fn) => stepCloze(c, fn)] : ['Письмо', (fn) => stepType(c, fn)];
  }
  function complete(it, c) {
    if (!it.errs) clean++;
    const t = Date.now();
    if (c.s === 'n' || c.d <= t) { Object.assign(c, sched(c, it.errs ? 1 : 2, t)); logReview(!it.errs, d); renderStats(); updated++; }
  }
  function show() {
    const climbed = items.reduce((s, x) => s + x.lv, 0), passed = items.filter((x) => x.lv >= 3).length;
    setBar(bar, items.length ? climbed / (items.length * 3) : 1, items.length ? passed + ' / ' + items.length : ''); box.replaceChildren(); keyHandler = null;
    if (items.length < 2) return box.append(endPanel(d, 'Нет подходящих карточек', ['Для лестницы нужно минимум две карточки с текстовым ответом.'], null));
    if (!q.length) {
      playSound('finish');
      return box.append(endPanel(d, 'Лестница пройдена', ['Карточек: ' + items.length + ', без ошибок: ' + clean + '.', updated ? 'Обновлён график повторений у карточек: ' + updated + '.' : ''], h('button', { class: 'btn pri', type: 'button', onclick: () => go({ n: 'study', id: d.id, mode: 'ladder' }) }, 'Ещё раз')));
    }
    const it = q[0], c = d.cards.find((x) => x.id === it.id), [name, make] = stepFor(it.lv, c);
    box.append(h('div', { class: 'rungs' }, [0, 1, 2].map((k) => h('i', { class: k < it.lv ? 'on' : null })), h('span', { text: 'Шаг ' + (it.lv + 1) + ' из 3: ' + name })),
      make((good) => {
        q.shift();
        if (good) it.lv++; else { it.errs++; it.lv = Math.max(0, it.lv - 1); }
        if (it.lv >= 3) complete(it, c); else q.splice(Math.min(2, q.length), 0, it);
        show();
      }));
  }
  show(); return root;
}

/* спринт: верна ли показанная пара */
const SPRINT_FX = { yes: { x: 1, y: 0.05, r: 12, label: 'Верно', kind: 'good' }, no: { x: -1, y: 0.05, r: -12, label: 'Неверно', kind: 'bad' } };
function sprintView(d) {
  const SEC = 60;
  const root = h('div', { class: 'stack' }), box = h('div', { class: 'stack' }), bar = progBar();
  const scoreEl = h('b', { text: '0' }), streakEl = h('b', { text: '0' }), fb = h('span', { class: 'fb', role: 'status' });
  const scoreRow = h('div', { class: 'row', hidden: true }, h('span', { class: 'chip' }, 'Очки ', scoreEl), h('span', { class: 'chip' }, 'Серия ', streakEl), fb);
  root.append(studyHead(d, 'Спринт'), bar, scoreRow, box);
  let score = 0, streak = 0, answered = 0, right = 0, t0 = 0, ended = false, bag = [];
  const misses = new Map();
  setBar(bar, 1, SEC + ' с');
  function start() {
    t0 = Date.now(); scoreRow.hidden = false;
    playSound('start');
    clearInterval(tick);
    tick = setInterval(() => {
      const left = SEC - (Date.now() - t0) / 1000;
      if (left <= 0) return end();
      setBar(bar, left / SEC, Math.ceil(left) + ' с');
    }, 100);
    next();
  }
  function next() {
    box.replaceChildren();
    if (!bag.length) bag = shuffle(d.cards);
    const c = bag.pop(), others = d.cards.filter((x) => x.id !== c.id && norm(aOf(x)) !== norm(aOf(c)));
    const truth = !others.length || Math.random() < 0.5, shown = truth ? aOf(c) : aOf(others[Math.floor(Math.random() * others.length)]);
    const scene = h('div', { class: 'scene enter' }, h('div', { class: 'flip sm static' }, h('div', { class: 'face duo' }, h('div', { class: 'q1' }, rich(qOf(c))), rich(shown))));
    let leaving = false;
    function answer(yes) {
      if (leaving || ended) return; leaving = true;
      const good = yes === truth;
      answered++;
      if (good) { right++; streak++; score += streak > 5 ? 2 : 1; fb.textContent = streak > 5 ? 'Серия больше пяти: +2' : 'Верно: +1'; }
      else { streak = 0; misses.set(c.id, c); fb.textContent = truth ? 'Ошибка: пара была верной' : 'Ошибка: пара была неверной'; }
      playSound(good ? 'right' : 'wrong');
      scoreEl.textContent = String(score); streakEl.textContent = String(streak);
      throwCard(scene, yes ? SPRINT_FX.yes : SPRINT_FX.no).then(() => { if (root.isConnected && !ended) next(); });
    }
    enableSwipe(scene, { can: () => !leaving && !ended, fxFor: (dx) => (dx > 0 ? SPRINT_FX.yes : SPRINT_FX.no), commit: (dir) => answer(dir > 0) });
    keyHandler = (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault(); if (!e.repeat) answer(e.key === 'ArrowRight');
    };
    box.append(stage(scene, 2), h('div', { class: 'twin' },
      h('button', { class: 'btn', type: 'button', onclick: () => answer(false) }, icon('back'), 'Неверно'),
      h('button', { class: 'btn pri', type: 'button', onclick: () => answer(true) }, 'Верно', icon('next'))));
  }
  function end() {
    if (ended) return; ended = true;
    clearInterval(tick); keyHandler = null; box.replaceChildren(); setBar(bar, 0, '0 с');
    playSound('finish');
    const best = d.sprint || 0, record = score > best;
    if (record) { d.sprint = score; touch(d); }
    box.append(endPanel(d, 'Очки: ' + score, [
      answered ? 'Ответов: ' + answered + ', верных: ' + right + ' (' + Math.round(right / answered * 100) + '%).' : 'Вы не успели ответить ни разу.',
      record ? 'Это новый рекорд колоды.' : 'Рекорд колоды: ' + best + '.'
    ], h('button', { class: 'btn pri', type: 'button', onclick: () => go({ n: 'study', id: d.id, mode: 'sprint' }) }, 'Ещё раз')));
    if (misses.size) box.append(h('h3', { text: 'Стоит повторить' }), h('div', { class: 'cards' }, [...misses.values()].map((c) => h('div', { class: 'crow' }, h('div', {}, rich(qOf(c))), h('div', { class: 'muted' }, rich(aOf(c)))))));
  }
  const startBtn = h('button', { class: 'btn pri', type: 'button', onclick: start }, 'Старт');
  box.append(h('div', { class: 'panel stack enter', style: 'text-align:center;align-items:center' },
    h('h2', { text: 'Спринт на ' + SEC + ' секунд' }),
    h('p', { class: 'muted', style: 'margin:0;max-width:52ch', text: 'На карточке термин и определение. Если пара верная, смахните вправо или нажмите →. Если нет, смахните влево или нажмите ←. После пяти верных ответов подряд каждый следующий даёт 2 очка.' }),
    d.sprint ? h('p', { style: 'margin:0;font-weight:700', text: 'Рекорд колоды: ' + d.sprint }) : null,
    startBtn));
  queueMicrotask(() => startBtn.focus());
  return root;
}
initStore();
</script>
